[project]
name = "slm"
version = "0.1.0"
description = "A small, highly capable language model you can train and run locally"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]
dev = ["pytest>=7.0"]

[project.scripts]
slm = "slm.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end training smoke test"]
