[project]
name = "pico-lm"
version = "0.2.0"
description = "A local language-model learning and experiment stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [{ name = "Matheus Soranzo", email = "matheussoranco@gmail.com" }]
keywords = ["llm", "transformer", "language-model", "pytorch", "from-scratch", "local-llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2,<3.0",
    "numpy>=1.24,<2.0",
    "tokenizers>=0.15,<1.0",
]

[project.optional-dependencies]
data = ["datasets>=2.18,<3.0"]
dev = ["pytest>=7.0,<9.0", "ruff==0.15.2"]  # ruff pinned: see .github/workflows/ci.yml

[project.scripts]
pico-lm = "pico_lm.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not slow\""
markers = [
    "slow: end-to-end training smoke test (deselect with -m 'not slow')",
    "gpu: requires a CUDA device",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Non-ASCII punctuation in strings/docstrings (en-dashes, arrows, check-marks).
    "RUF001",
    "RUF002",
    "RUF003",
    # Config/schema class attributes are read-only signatures.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
