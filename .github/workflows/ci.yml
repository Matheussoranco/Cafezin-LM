name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    # weekly full run, including the slow end-to-end training smoke test
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        # PINNED EXACTLY, and it must stay that way. An unpinned ruff means the
        # rule set is whatever the newest release defaults to: ruff 0.16.0
        # widened its built-in defaults and turned a sibling project's CI red
        # with 89 findings in code that had not changed. Keep in lockstep with
        # the `ruff==` pin in pyproject's [dev] extra.
        run: pip install "ruff==0.15.2"

      - name: Ruff lint
        run: ruff check src/ tests/ experiments/

      - name: Ruff format check
        run: ruff format --check src/ tests/ experiments/

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # CPU-only wheels: the default index pulls multi-GB CUDA builds that the
      # runner has no GPU for anyway.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      # Include end-to-end training on both supported operating systems.
      - name: Run tests
        run: pytest -m "not gpu" --tb=short -q

  slow:
    name: End-to-end training smoke test
    runs-on: ubuntu-latest
    # opt-in: run manually, or on the weekly schedule below
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run the slow suite
        run: pytest -m slow --tb=short -q
